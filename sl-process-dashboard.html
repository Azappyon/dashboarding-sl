<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SL Process · Dashboard Google Ads</title>
<meta name="description" content="Dashboard de performance da campanha de Google Ads da SL Process — Engenharia Industrial. Upload mensal de planilhas e relatório gerado automaticamente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23003958'/><text x='50' y='63' font-family='Arial' font-size='42' font-weight='700' fill='%23E29601' text-anchor='middle'>SL</text></svg>">
<style>
/* ===================================================================
   SL PROCESS · Dashboard Google Ads
   Sistema visual: Material Design 3 semeado com a marca SL Process
   =================================================================== */
:root{
  /* -- cor da marca / seed -- */
  --brand:#003958;            /* azul institucional */
  --brand-2:#00293f;          /* azul mais escuro */
  --accent:#E29601;           /* laranja institucional */

  /* -- Material 3: papéis de cor (light) -- */
  --primary:#003958;
  --on-primary:#FFFFFF;
  --primary-container:#CFE6F3;
  --on-primary-container:#062E45;
  --secondary:#507184;
  --secondary-container:#DCE7ED;
  --tertiary:#E29601;
  --on-tertiary:#FFFFFF;
  --tertiary-container:#FBE7C4;
  --on-tertiary-container:#5A3B00;

  --surface:#FFFFFF;
  --surface-dim:#EDF1F4;
  --surface-bright:#FFFFFF;
  --surface-1:#F7F9FB;        /* container lowest */
  --surface-2:#F1F5F8;        /* container */
  --surface-3:#EAF0F4;        /* container high */
  --bg:#EEF2F5;               /* fundo geral */

  --on-surface:#172B36;
  --on-surface-variant:#55636B;
  --outline:#BDC7CD;
  --outline-variant:#E1E7EB;

  --success:#2E7D5B;
  --success-container:#DEF0E7;
  --error:#B4472E;
  --error-container:#F8E4DE;
  --warning:#9A6A06;
  --warning-container:#FBECCF;

  /* -- paleta de gráficos (validada CVD: dataviz) -- */
  --c1:#1670A6;  /* azul */
  --c2:#E29601;  /* laranja */
  --c3:#2FA6A0;  /* teal */
  --c4:#8E5FB0;  /* roxo */
  --c-neutral:#9AAEB8; /* "Desconhecido"/sem sinal */
  --grid:#E6EBEE;

  /* -- elevação (Material) -- */
  --e1:0 1px 2px rgba(9,30,42,.06), 0 1px 3px rgba(9,30,42,.05);
  --e2:0 2px 6px rgba(9,30,42,.06), 0 8px 20px rgba(9,30,42,.07);
  --e3:0 8px 24px rgba(9,30,42,.12), 0 16px 40px rgba(9,30,42,.12);

  /* -- forma -- */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:28px; --r-full:999px;

  --rail-w:256px;
  --font:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.2,0,0,1);
  --ease-emph:cubic-bezier(.2,0,0,1);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--on-surface);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit}
.hidden{display:none !important}

/* Material Symbols */
.msym{
  font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;
  font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;
  white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';
  -webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  user-select:none;flex:none;
}
.msym.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.msym.s18{font-size:18px}.msym.s20{font-size:20px}.msym.s28{font-size:28px}

/* ===================== LAYOUT ===================== */
.app{display:flex;min-height:100vh}
.rail{
  width:var(--rail-w);flex:0 0 var(--rail-w);
  background:linear-gradient(180deg,#003958,#00293f);
  color:#D7E3EA;position:fixed;inset:0 auto 0 0;z-index:40;display:flex;flex-direction:column;
}
.main{margin-left:var(--rail-w);flex:1;min-width:0;display:flex;flex-direction:column}

/* Marca */
.brand{padding:22px 20px 16px;display:flex;align-items:center;gap:12px}
.brand .mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;
  box-shadow:0 4px 12px rgba(226,150,1,.35)}
.brand .name{color:#fff;font-weight:600;font-size:17px;line-height:1.1}
.brand .sub{color:#8FAABA;font-size:11.5px;margin-top:2px}

/* Navigation rail (Material: indicador ativo em pílula) */
.nav{padding:8px 12px;flex:1;overflow-y:auto}
.nav-item{
  position:relative;display:flex;align-items:center;gap:14px;width:100%;
  padding:11px 14px;margin:3px 0;border:0;background:transparent;cursor:pointer;
  color:#C3D4DE;font-family:var(--font);font-size:13.5px;text-align:left;
  border-radius:var(--r-full);transition:background .18s var(--ease),color .18s var(--ease);
}
.nav-item .msym{font-size:21px;flex:none}
.nav-item .idx{margin-left:auto;font-size:11px;color:#7C9AAB;font-variant-numeric:tabular-nums}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav-item.active{background:#fff;color:var(--brand);font-weight:600}
.nav-item.active .msym{font-variation-settings:'FILL' 1,'wght' 500}
.nav-item.active .idx{color:var(--accent)}
.rail-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#8FAABA;line-height:1.5}

/* App bar */
.appbar{
  background:var(--surface);border-bottom:1px solid var(--outline-variant);
  padding:14px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  position:sticky;top:0;z-index:30;
}
.appbar .lead{display:flex;align-items:center;gap:14px;min-width:0}
.appbar .crumb{font-size:11.5px;color:var(--on-surface-variant)}
.appbar h1{font-size:19px;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .actions{display:flex;align-items:center;gap:12px;flex:none}

.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);color:var(--on-surface-variant);
  border:1px solid var(--outline-variant);border-radius:var(--r-full);padding:7px 14px;font-size:12.5px;font-weight:500}
.chip .msym{font-size:17px;color:var(--secondary)}

/* Botões Material */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:9px;cursor:pointer;
  font-family:var(--font);font-size:13.5px;font-weight:600;border-radius:var(--r-full);
  padding:10px 20px;border:1px solid transparent;transition:box-shadow .18s var(--ease),background .18s var(--ease);}
.btn .msym{font-size:19px}
.btn-filled{background:var(--accent);color:#fff;box-shadow:var(--e1)}
.btn-filled:hover{box-shadow:var(--e2);background:#cc8807}
.btn-tonal{background:var(--primary-container);color:var(--on-primary-container)}
.btn-tonal:hover{box-shadow:var(--e1)}
.btn-text{background:transparent;color:var(--primary);padding:10px 14px}
.btn-text:hover{background:var(--surface-2)}
.btn-outline{background:transparent;border-color:var(--outline);color:var(--on-surface)}
.btn-outline:hover{background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ===================== CONTEÚDO ===================== */
.content{padding:26px 30px 60px;max-width:1280px;width:100%;animation:pageIn .35s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.page-head{margin-bottom:22px}
.page-head .eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--accent);font-size:11.5px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.page-head h2{font-size:26px;color:var(--brand);margin-top:8px;letter-spacing:-.02em}
.page-head p{color:var(--on-surface-variant);font-size:14px;margin-top:8px;max-width:74ch}

.section-title{font-size:14.5px;color:var(--brand);font-weight:600;margin:0 0 16px;display:flex;align-items:center;gap:10px}
.section-title .msym{font-size:20px;color:var(--accent)}

/* Grid / bento */
.grid{display:grid;gap:18px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-3-2{grid-template-columns:2fr 1fr}
.g-2-3{grid-template-columns:1fr 1.4fr}
.span-2{grid-column:span 2}

/* Cartões (Material) */
.card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--r-md);
  box-shadow:var(--e1);transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
.card.hover:hover{box-shadow:var(--e2);transform:translateY(-2px)}
.card-pad{padding:22px 24px}

/* KPI */
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--outline-variant);
  border-radius:var(--r-md);padding:18px 20px;box-shadow:var(--e1);transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
.kpi:hover{box-shadow:var(--e2);transform:translateY(-2px)}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between}
.kpi .k-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--primary-container);color:var(--on-primary-container)}
.kpi .k-ic .msym{font-size:21px}
.kpi.accent .k-ic{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.kpi .k-delta{font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--r-full);display:inline-flex;align-items:center;gap:3px}
.kpi .k-delta .msym{font-size:14px}
.kpi .k-delta.up{background:var(--success-container);color:var(--success)}
.kpi .k-delta.down{background:var(--error-container);color:var(--error)}
.kpi .k-delta.flat{background:var(--surface-2);color:var(--on-surface-variant)}
.kpi .k-label{font-size:12px;color:var(--on-surface-variant);font-weight:500;margin-top:14px}
.kpi .k-value{font-size:28px;font-weight:600;color:var(--on-surface);margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.kpi .k-sub{font-size:11.5px;color:var(--on-surface-variant);margin-top:6px;display:flex;align-items:center;gap:5px}
.kpi .k-sub .msym{font-size:14px;color:var(--secondary)}
.kpi .meter{height:5px;border-radius:var(--r-full);background:var(--surface-3);margin-top:12px;overflow:hidden}
.kpi .meter i{display:block;height:100%;border-radius:var(--r-full);background:var(--accent);width:0;transition:width .9s var(--ease)}

/* Tabelas (Material data table) */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-md)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl thead th{position:sticky;top:0;text-align:left;color:var(--on-surface-variant);font-weight:600;
  font-size:11.5px;letter-spacing:.02em;padding:13px 16px;border-bottom:1px solid var(--outline-variant);background:var(--surface-1)}
table.tbl td{padding:13px 16px;border-bottom:1px solid var(--outline-variant);vertical-align:middle}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl tbody tr{transition:background .12s var(--ease)}
table.tbl tbody tr:hover{background:var(--surface-1)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank{color:var(--on-surface-variant);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600}
.dim-name{font-weight:500;color:var(--on-surface)}
.dim-sub{color:var(--on-surface-variant);font-size:11.5px}
.cell-dim{display:flex;align-items:center;gap:9px;font-weight:500;color:var(--on-surface)}
.cell-dim .dot{width:9px;height:9px;border-radius:3px;flex:none}

/* Chips de estado */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--r-full);font-size:11px;font-weight:600}
.pill .msym{font-size:13px}
.pill-good{background:var(--success-container);color:var(--success)}
.pill-bad{background:var(--error-container);color:var(--error)}
.pill-warn{background:var(--warning-container);color:var(--warning)}
.pill-neutral{background:var(--surface-2);color:var(--secondary)}

/* Barra de dados dentro de célula */
.cellbar{height:7px;border-radius:var(--r-full);background:var(--surface-3);overflow:hidden;min-width:70px}
.cellbar i{display:block;height:100%;border-radius:var(--r-full)}

/* Destaques */
.hl-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
.hl{border-radius:var(--r-md);padding:20px 22px;background:var(--surface);box-shadow:var(--e1);border:1px solid var(--outline-variant);position:relative;overflow:hidden}
.hl::before{content:"";position:absolute;inset:0 auto 0 0;width:4px}
.hl.best::before{background:var(--success)} .hl.worst::before{background:var(--error)}
.hl .hl-cap{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.hl.best .hl-cap{color:var(--success)} .hl.worst .hl-cap{color:var(--error)}
.hl .hl-cap .msym{font-size:18px}
.hl .hl-name{font-size:17px;font-weight:600;margin-top:10px;color:var(--on-surface)}
.hl .hl-metrics{display:flex;gap:26px;margin-top:14px;flex-wrap:wrap}
.hl .hl-metrics .mv{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.hl .hl-metrics .ml{font-size:11px;color:var(--on-surface-variant)}

/* ===================== GRÁFICOS ===================== */
.chart{width:100%;display:block;overflow:visible}
.chart .slice,.chart .bar,.chart .vbar{cursor:pointer;transition:opacity .15s var(--ease)}
.chart-anim .slice{opacity:0;animation:fadeIn .5s var(--ease) forwards}
.chart-anim .bar{transform:scaleX(0);transform-origin:left center;animation:growX .6s var(--ease) forwards}
.chart-anim .vbar{transform:scaleY(0);transform-origin:bottom;animation:growY .6s var(--ease) forwards}
@keyframes growX{to{transform:scaleX(1)}}
@keyframes growY{to{transform:scaleY(1)}}
@keyframes fadeIn{to{opacity:1}}
.chart:hover .slice:not(:hover){opacity:.5}
.chart:hover .bar:not(:hover){opacity:.55}
.svg-cat{font-size:12px;fill:var(--on-surface);font-family:var(--font)}
.svg-val{font-size:12px;fill:var(--on-surface);font-family:var(--font);font-weight:600}
.svg-sub{font-size:10.5px;fill:var(--on-surface-variant);font-family:var(--font)}
.svg-center-t{font-size:11px;fill:var(--on-surface-variant);font-family:var(--font)}
.svg-center-v{font-size:19px;fill:var(--on-surface);font-family:var(--font);font-weight:700}
.svg-grid{stroke:var(--grid);stroke-width:1}

.legend{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.legend .lg{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--on-surface);cursor:default}
.legend .lg .sw{width:12px;height:12px;border-radius:4px;flex:none}
.legend .lg .lg-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--on-surface-variant)}
.legend .lg .lg-val{font-weight:600;font-variant-numeric:tabular-nums}
.legend .lg .lg-pct{font-size:11px;color:var(--on-surface-variant);width:44px;text-align:right;font-variant-numeric:tabular-nums}

/* Tooltip global */
.tooltip{position:fixed;z-index:200;pointer-events:none;background:var(--brand-2);color:#fff;
  border-radius:var(--r-sm);padding:9px 12px;font-size:12px;box-shadow:var(--e3);opacity:0;transform:translateY(4px);
  transition:opacity .12s var(--ease),transform .12s var(--ease);max-width:260px}
.tooltip.show{opacity:1;transform:none}
.tooltip .tt-t{font-weight:600;margin-bottom:3px}
.tooltip .tt-r{display:flex;justify-content:space-between;gap:16px;color:#CFE0E9;font-variant-numeric:tabular-nums}
.tooltip .tt-r b{color:#fff;font-weight:600}

/* Estado vazio */
.empty{border:1px dashed var(--outline);border-radius:var(--r-md);padding:44px 30px;text-align:center;background:var(--surface-1)}
.empty .msym{font-size:38px;color:var(--secondary);opacity:.75}
.empty h3{font-size:15.5px;color:var(--brand);margin-top:12px}
.empty p{color:var(--on-surface-variant);font-size:13.5px;margin-top:8px;max-width:56ch;margin-inline:auto}

/* Insights */
.ins-col{display:flex;flex-direction:column;gap:14px}
.ins{border-radius:var(--r-md);background:var(--surface);border:1px solid var(--outline-variant);padding:18px 20px;box-shadow:var(--e1);display:flex;gap:14px;transition:box-shadow .2s var(--ease)}
.ins:hover{box-shadow:var(--e2)}
.ins .ic{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center}
.ins .ic .msym{font-size:20px;color:#fff}
.ins.pos .ic{background:var(--success)} .ins.opp .ic{background:var(--accent)}
.ins .it{font-weight:600;font-size:14.5px}
.ins .id{font-size:13px;color:var(--on-surface-variant);margin-top:4px;line-height:1.55}
.ins .act{font-size:12.5px;color:var(--on-primary-container);margin-top:10px;background:var(--primary-container);padding:9px 12px;border-radius:var(--r-sm);display:flex;gap:7px}
.ins .act .msym{font-size:16px;flex:none;margin-top:1px}
.priority{border-radius:var(--r-lg);background:linear-gradient(135deg,#00405f,#002336);color:#fff;padding:28px 30px;box-shadow:var(--e2);position:relative;overflow:hidden}
.priority::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(226,150,1,.22),transparent 70%)}
.priority .p-cap{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.priority h3{font-size:20px;margin-top:14px}
.priority p{color:#CFE0E9;font-size:14.5px;margin-top:12px;line-height:1.65;max-width:92ch}

/* Banner / callouts */
.callout{display:flex;align-items:flex-start;gap:11px;border-radius:var(--r-sm);padding:13px 16px;font-size:13px;line-height:1.5}
.callout .msym{font-size:20px;flex:none;margin-top:1px}
.callout.info{background:var(--primary-container);color:var(--on-primary-container)}
.callout.info .msym{color:var(--primary)}
.callout.warn{background:var(--warning-container);color:var(--warning)}
.callout.warn .msym{color:var(--warning)}
.callout b{font-weight:600}
.footnote{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--on-surface-variant);margin-top:14px}
.footnote .msym{font-size:15px;color:var(--secondary)}
.mt18{margin-top:18px}.mt24{margin-top:24px}

/* Contexto (painéis de benchmark p/ páginas leves) */
.ctx{display:flex;flex-direction:column;gap:14px}
.ctx-item{display:flex;gap:12px;align-items:flex-start}
.ctx-item .ci{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none}
.ctx-item .ci .msym{font-size:19px;color:var(--secondary)}
.ctx-item .ct{font-size:13px;font-weight:600}
.ctx-item .cd{font-size:12px;color:var(--on-surface-variant);margin-top:2px;line-height:1.5}
.ctx-big{font-size:30px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* Dialog (Material) */
.scrim{position:fixed;inset:0;background:rgba(9,30,42,.5);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s var(--ease)}
.dialog{background:var(--surface);border-radius:var(--r-xl);max-width:580px;width:100%;box-shadow:var(--e3);overflow:hidden;animation:dialogIn .28s var(--ease-emph)}
@keyframes dialogIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.dialog .d-head{padding:24px 28px 4px;display:flex;gap:14px;align-items:flex-start}
.dialog .d-head .d-ic{width:44px;height:44px;border-radius:var(--r-full);background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;justify-content:center;flex:none}
.dialog h3{font-size:19px;color:var(--brand)}
.dialog .d-head p{font-size:13px;color:var(--on-surface-variant);margin-top:5px}
.dialog .d-body{padding:16px 28px 26px}
.dropzone{border:2px dashed var(--outline);border-radius:var(--r-md);padding:32px 20px;text-align:center;cursor:pointer;transition:.18s var(--ease);background:var(--surface-1)}
.dropzone:hover{border-color:var(--secondary)}
.dropzone.drag{border-color:var(--accent);background:var(--tertiary-container)}
.dropzone .msym{font-size:40px;color:var(--secondary)}
.dropzone .dz-t{font-weight:600;margin-top:10px;font-size:14.5px}
.dropzone .dz-s{color:var(--on-surface-variant);font-size:12.5px;margin-top:4px}
.file-list{margin-top:16px;max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
.file-row{display:flex;align-items:center;gap:11px;font-size:13px;padding:9px 13px;border-radius:var(--r-sm);background:var(--surface-1);border:1px solid var(--outline-variant)}
.file-row .msym{font-size:19px;flex:none}
.file-row.ok .msym{color:var(--success)} .file-row.err .msym{color:var(--error)}
.file-row .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.file-row .ft{color:var(--on-surface-variant);font-size:11.5px}
.d-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.d-foot .note{font-size:12px;color:var(--on-surface-variant)}
.d-foot .acts{display:flex;gap:8px}

/* Banner amostra */
.sample-banner{margin-bottom:22px}

/* Menu (mobile) */
.menu-btn{display:none;background:none;border:0;cursor:pointer;color:var(--brand);padding:6px;border-radius:var(--r-full)}
.menu-btn:hover{background:var(--surface-2)}
.rail-scrim{position:fixed;inset:0;background:rgba(9,30,42,.45);z-index:39}

/* ===================== RESPONSIVO ===================== */
@media (max-width:1120px){
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .g-2,.g-3,.g-3-2,.g-2-3,.hl-row{grid-template-columns:1fr}
  .span-2{grid-column:auto}
}
@media (max-width:820px){
  :root{--rail-w:0px}
  .rail{transform:translateX(-100%);transition:transform .25s var(--ease);width:264px;flex-basis:264px}
  .rail.open{transform:none}
  .main{margin-left:0}
  .menu-btn{display:inline-flex}
  .content{padding:20px 16px 52px}
  .appbar{padding:12px 16px}
  .appbar .crumb{display:none}
  .btn-filled .btn-txt{display:none}
  .btn-filled{padding:11px}
}
@media (max-width:640px){
  #periodChip{display:none}
  .appbar{flex-wrap:wrap}
}
@media (max-width:520px){
  .g-kpi{grid-template-columns:1fr}
  .page-head h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  .chart-anim .slice{opacity:1}
  .chart-anim .bar{transform:none}
  .chart-anim .vbar{transform:none}
}

/* ===================================================================
   APP LAYER — slicer, tabelas ordenáveis, apresentação, tema escuro
   =================================================================== */

/* Botões de ícone (app bar) */
.icon-btn{width:42px;height:42px;border-radius:var(--r-full);border:1px solid var(--outline-variant);
  background:var(--surface);color:var(--on-surface-variant);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.15s var(--ease);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--on-surface)}
.icon-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.icon-btn .msym{font-size:21px}

/* Slicer bar */
.slicer{position:sticky;top:71px;z-index:25;background:var(--surface);border-bottom:1px solid var(--outline-variant);
  padding:11px 30px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.slicer .s-lab{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--on-surface-variant)}
.slicer .s-lab .msym{font-size:18px;color:var(--secondary)}
.slice-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--r-full);
  border:1px solid var(--outline);background:var(--surface);color:var(--on-surface);font-family:var(--font);
  font-size:12.5px;font-weight:500;cursor:pointer;transition:.14s var(--ease)}
.slice-chip:hover{background:var(--surface-2)}
.slice-chip .dot{width:9px;height:9px;border-radius:3px;flex:none}
.slice-chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.slice-chip.active .msym{color:#fff}
.slice-chip.all.active{background:var(--brand);border-color:var(--brand)}
.slicer .s-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.slicer .s-note{font-size:12px;color:var(--on-surface-variant)}
.slicer .s-clear{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;padding:6px 8px;border-radius:var(--r-sm)}
.slicer .s-clear:hover{background:var(--tertiary-container)}
.filter-flag{display:inline-flex;align-items:center;gap:6px;background:var(--tertiary-container);color:var(--on-tertiary-container);
  border-radius:var(--r-full);padding:5px 12px;font-size:12px;font-weight:600;margin-bottom:16px}
.filter-flag .msym{font-size:16px}

/* Tabelas ordenáveis */
.dt-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.dt-search{display:flex;align-items:center;gap:8px;background:var(--surface-1);border:1px solid var(--outline-variant);
  border-radius:var(--r-full);padding:7px 14px;min-width:210px;flex:1;max-width:320px}
.dt-search .msym{font-size:18px;color:var(--on-surface-variant)}
.dt-search input{border:0;background:none;outline:none;font-family:var(--font);font-size:13px;color:var(--on-surface);width:100%}
.dt-search input::placeholder{color:var(--on-surface-variant)}
.dt-count{font-size:12px;color:var(--on-surface-variant);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable .sort-ic{display:inline-flex;vertical-align:middle;margin-left:3px;opacity:.5}
th.sortable .sort-ic .msym{font-size:16px}
th.sortable:hover{color:var(--on-surface)}
th.sortable.active{color:var(--brand)}
th.sortable.active .sort-ic{opacity:1}
th.sortable.num{text-align:right}
th.sortable:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.dt tbody tr{animation:rowIn .25s var(--ease)}
@keyframes rowIn{from{opacity:.4}to{opacity:1}}

/* Marcas clicáveis (cross-filter) */
[data-slice]{cursor:pointer}
.legend .lg.clickable{cursor:pointer;padding:3px 6px;margin:-3px -6px;border-radius:var(--r-sm);transition:background .14s}
.legend .lg.clickable:hover{background:var(--surface-2)}
.legend .lg.dim{opacity:.4}

/* Modo apresentação */
body.present .rail{transform:translateX(-100%)}
body.present .main{margin-left:0}
body.present .appbar{display:none}
body.present .slicer{top:0}
body.present .content{max-width:1500px;padding-top:34px}
.present-bar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:none;
  align-items:center;gap:6px;background:var(--brand-2);color:#fff;border-radius:var(--r-full);padding:8px 10px;box-shadow:var(--e3)}
body.present .present-bar{display:flex}
.present-bar button{width:38px;height:38px;border-radius:var(--r-full);border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.present-bar button:hover{background:rgba(255,255,255,.22)}
.present-bar .pb-pos{font-size:13px;font-weight:600;padding:0 12px;min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.present-bar .pb-exit{background:var(--accent)}
.present-bar .pb-exit:hover{background:#cc8807}

<body>
<div class="app" id="app"></div>
<script>
/* =====================================================================
   SL PROCESS — Núcleo de parsing de relatórios do Google Ads (pt-BR)
   Funciona em Node (verificação) e no navegador (embutido no index.html).
   Sem dependências externas.
   ===================================================================== */
(function (root) {
  'use strict';

  /* ---- Normalização de texto (remove acentos, minúsculas, espaços) ---- */
  function norm(s) {
    return String(s == null ? '' : s)
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .trim().toLowerCase().replace(/\s+/g, ' ');
  }

  /* ---- Número no formato brasileiro: "1.234,56", "R$ 3,51", "6,06%" ---- */
  function num(v) {
    if (v == null) return 0;
    var s = String(v).trim();
    if (!s) return 0;
    s = s.replace(/%/g, '').replace(/r\$/gi, '').replace(/\s/g, '');
    if (s === '' || s === '--' || s === '-') return 0;
    var neg = false;
    if (s[0] === '-') { neg = true; s = s.slice(1); }
    // remove separador de milhar (.) e troca vírgula decimal por ponto
    s = s.replace(/\./g, '').replace(',', '.');
    var n = parseFloat(s);
    if (isNaN(n)) return 0;
    return neg ? -n : n;
  }

  /* ---- Parser CSV RFC-4180 (aspas, vírgulas e quebras dentro de campo) ---- */
  function parseCSV(text) {
    // remove BOM
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var rows = [], field = '', row = [], i = 0, inQ = false, c, n;
    var len = text.length;
    while (i < len) {
      c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"') { inQ = true; i++; continue; }
      if (c === ',') { row.push(field); field = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++;
    }
    // último campo/linha
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows;
  }

  /* ---- Aliases das métricas padronizadas do Google Ads ---- */
  var METRIC_ALIASES = {
    impressions: ['impr.', 'impressoes', 'impr'],
    clicks:      ['cliques', 'cliques '],
    ctr:         ['ctr'],
    cpc:         ['cpc med.', 'cpc medio', 'cpc med'],
    cost:        ['custo'],
    conversions: ['conversoes', 'conv.'],
    cpa:         ['custo / conv.', 'custo/conv.', 'custo / conv', 'custo/ conv.', 'custo /conv.'],
    convRate:    ['taxa de conv.', 'taxa de conv', 'taxa conv.']
  };

  /* ---- Identificação do tipo de relatório pelo título (linha 1) ---- */
  var TYPE_MATCHERS = [
    ['campaign',   ['relatorio de campanha']],
    ['adgroup',    ['relatorio do grupo de anuncios', 'relatorio de grupos de anuncios']],
    ['ads',        ['relatorio de anuncios']],
    ['keywords',   ['relatorio de palavras-chave da rede de pesquisa', 'relatorio de palavras-chave']],
    ['searchterms',['relatorio de termos de pesquisa']],
    ['locations',  ['relatorio de locais']],
    ['devices',    ['relatorio de dispositivos']],
    ['schedule',   ['relatorio de programacao de anuncios']],
    ['age',        ['relatorio de idade']],
    ['gender',     ['relatorio por genero', 'relatorio de genero']],
    ['income',     ['relatorio de renda familiar']]
  ];

  function detectType(title, header) {
    var t = norm(title);
    for (var i = 0; i < TYPE_MATCHERS.length; i++) {
      var key = TYPE_MATCHERS[i][0], pats = TYPE_MATCHERS[i][1];
      for (var j = 0; j < pats.length; j++) {
        if (t.indexOf(pats[j]) !== -1) return key;
      }
    }
    // fallback: tenta por coluna dimensão característica no header
    var hn = (header || []).map(norm);
    if (hn.indexOf('dispositivo') !== -1) return 'devices';
    if (hn.indexOf('local') !== -1) return 'locations';
    if (hn.indexOf('idade') !== -1) return 'age';
    if (hn.indexOf('sexo') !== -1) return 'gender';
    if (hn.indexOf('renda familiar') !== -1) return 'income';
    if (hn.indexOf('palavra-chave') !== -1) return 'keywords';
    if (hn.indexOf('termo de pesquisa') !== -1) return 'searchterms';
    if (hn.indexOf('data e hora') !== -1) return 'schedule';
    return 'unknown';
  }

  function isTotalRow(cells) {
    for (var i = 0; i < cells.length; i++) {
      var c = norm(cells[i]);
      if (c.indexOf('total:') === 0 || c === 'total') return true;
    }
    return false;
  }
  function isEmptyRow(cells) {
    for (var i = 0; i < cells.length; i++) {
      if (String(cells[i] == null ? '' : cells[i]).trim() !== '') return false;
    }
    return true;
  }

  /* ---- Encontra a linha de cabeçalho (procura por 'Impr.' ou 'Cliques') ---- */
  function findHeaderIndex(rows) {
    for (var i = 0; i < Math.min(rows.length, 8); i++) {
      var hn = rows[i].map(norm);
      if (hn.indexOf('impr.') !== -1 || hn.indexOf('cliques') !== -1) return i;
    }
    return 2; // padrão do Google Ads: título, período, cabeçalho
  }

  /* ---- Constrói índice de coluna para cada métrica ---- */
  function buildColIndex(header) {
    var hn = header.map(norm), idx = {};
    Object.keys(METRIC_ALIASES).forEach(function (metric) {
      var aliases = METRIC_ALIASES[metric];
      for (var i = 0; i < hn.length; i++) {
        if (aliases.indexOf(hn[i]) !== -1) { idx[metric] = i; break; }
      }
    });
    return idx;
  }
  function colOf(header, name) {
    var hn = header.map(norm), target = norm(name);
    for (var i = 0; i < hn.length; i++) if (hn[i] === target) return i;
    // startsWith fallback
    for (var k = 0; k < hn.length; k++) if (hn[k].indexOf(target) === 0) return k;
    return -1;
  }

  /* ---- Parse principal de um relatório ---- */
  function parseReport(text, fileName) {
    var rows = parseCSV(text).filter(function (r) { return r.length > 1 || (r.length === 1 && r[0].trim() !== ''); });
    if (!rows.length) return null;
    var title = (rows[0] && rows[0][0]) || fileName || '';
    var hIdx = findHeaderIndex(rows);
    var period = hIdx >= 1 ? (rows[1] && rows[1][0]) || '' : '';
    var header = rows[hIdx] || [];
    var type = detectType(title, header);
    var colIndex = buildColIndex(header);

    var body = rows.slice(hIdx + 1);
    var dataRows = [], totalRows = [];
    body.forEach(function (r) {
      if (isEmptyRow(r)) return;
      if (isTotalRow(r)) { totalRows.push(r); return; }
      dataRows.push(r);
    });

    // total canônico da campanha (para o resumo executivo)
    var campaignTotal = null;
    totalRows.forEach(function (r) {
      var joined = r.map(norm).join('|');
      if (joined.indexOf('total: campanha') !== -1 || joined.indexOf('total: conta') !== -1) {
        if (!campaignTotal) campaignTotal = r;
      }
    });
    if (!campaignTotal && totalRows.length) campaignTotal = totalRows[0];

    function metric(row, name) {
      var i = colIndex[name];
      if (i == null || i < 0) return 0;
      return num(row[i]);
    }
    return {
      type: type, title: title, period: period, fileName: fileName || '',
      header: header, colIndex: colIndex,
      rows: dataRows, totalRows: totalRows, campaignTotal: campaignTotal,
      metric: metric,
      col: function (name) { return colOf(header, name); },
      text: function (row, name) { var i = colOf(header, name); return i < 0 ? '' : String(row[i] == null ? '' : row[i]).trim(); }
    };
  }

  /* ---- Métricas derivadas coerentes a partir de somas ---- */
  function derive(m) {
    var imp = m.impressions || 0, cl = m.clicks || 0, co = m.cost || 0, cv = m.conversions || 0;
    return {
      impressions: imp, clicks: cl, cost: co, conversions: cv,
      ctr: imp > 0 ? cl / imp : 0,
      cpc: cl > 0 ? co / cl : 0,
      cpa: cv > 0 ? co / cv : 0,
      convRate: cl > 0 ? cv / cl : 0
    };
  }

  /* ---- Agrega linhas de um relatório por uma coluna-dimensão ---- */
  function aggregateBy(report, dimName, opts) {
    opts = opts || {};
    var di = report.col(dimName);
    var map = {};
    report.rows.forEach(function (row) {
      var key = di >= 0 ? String(row[di] == null ? '' : row[di]).trim() : '(todos)';
      if (!key) key = opts.emptyLabel || '(não informado)';
      if (!map[key]) map[key] = { key: key, impressions: 0, clicks: 0, cost: 0, conversions: 0, count: 0, extra: {} };
      var b = map[key];
      b.impressions += report.metric(row, 'impressions');
      b.clicks      += report.metric(row, 'clicks');
      b.cost        += report.metric(row, 'cost');
      b.conversions += report.metric(row, 'conversions');
      b.count += 1;
      if (opts.keep) opts.keep.forEach(function (colName) {
        if (b.extra[colName] == null) {
          var i = report.col(colName);
          if (i >= 0 && String(row[i]).trim()) b.extra[colName] = String(row[i]).trim();
        }
      });
    });
    return Object.keys(map).map(function (k) {
      var b = map[k], d = derive(b);
      d.key = b.key; d.count = b.count; d.extra = b.extra;
      return d;
    });
  }

  var API = {
    norm: norm, num: num, parseCSV: parseCSV, detectType: detectType,
    parseReport: parseReport, derive: derive, aggregateBy: aggregateBy,
    METRIC_ALIASES: METRIC_ALIASES
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  else root.SLParser = API;
})(typeof window !== 'undefined' ? window : this);

  function vbars(items,opts){

    var n=items.length,gap=16,bw=Math.min((W-padL*2-gap*(n-1))/n,86),totalW=bw*n+gap*(n-1),startX=padL+(W-padL*2-totalW)/2;

  function funnel(t){

  var TABLES={};
  function dataTable(id,cols,rows,opts){
    opts=opts||{};TABLES[id]={cols:cols,rows:rows,sort:opts.sort||null,q:'',opts:opts};
    var n=dtView(TABLES[id]).length;
    var tools=opts.search?'<div class="dt-tools"><div class="dt-search">'+msym('search','s18')+'<input type="text" placeholder="'+esc(opts.searchPlaceholder||'Pesquisar…')+'" aria-label="Pesquisar na tabela"></div><span class="dt-count" id="dtc-'+id+'">'+n+' de '+rows.length+' linhas</span></div>':'';
    return '<div class="dt" data-dt="'+id+'">'+tools+'<div class="tbl-wrap" data-dtbody>'+dtInner(id)+'</div></div>';
  }
  function dtView(t){
    var rows=t.rows.slice();
    if(t.q){var q=t.q.toLowerCase(),keys=t.opts.searchKeys||t.cols.map(function(c){return c.key;});
      rows=rows.filter(function(r){return keys.some(function(k){return String(r[k]==null?'':r[k]).toLowerCase().indexOf(q)>=0;});});}
    if(t.sort){var c=null;t.cols.forEach(function(x){if(x.key===t.sort.key)c=x;});
      if(c){var dir=t.sort.dir==='asc'?1:-1;rows.sort(function(a,b){var va=c.sortVal?c.sortVal(a):a[c.key],vb=c.sortVal?c.sortVal(b):b[c.key];
        if(typeof va==='string')va=va.toLowerCase();if(typeof vb==='string')vb=vb.toLowerCase();return va<vb?-dir:va>vb?dir:0;});}}
    return rows;
  }
  function isNumCol(t,key){var c=null;t.cols.forEach(function(x){if(x.key===key)c=x;});return c&&(c.num||c.sortVal);}
  function dtInner(id){
    var t=TABLES[id],rows=dtView(t);
    var th=t.cols.map(function(c){var sortable=c.sortable!==false,active=t.sort&&t.sort.key===c.key;
      var cls=(c.num?'num ':'')+(sortable?'sortable':'')+(active?' active':'');
      var attrs=sortable?' role="button" tabindex="0" data-sortkey="'+esc(c.key)+'" aria-sort="'+(active?(t.sort.dir==='asc'?'ascending':'descending'):'none')+'"':'';
      var ic=sortable?'<span class="sort-ic">'+msym(active?(t.sort.dir==='asc'?'arrow_upward':'arrow_downward'):'unfold_more','s18')+'</span>':'';
      return '<th class="'+cls+'"'+attrs+'>'+esc(c.label)+ic+'</th>';}).join('');
    var tb=rows.length?rows.map(function(r){return '<tr>'+t.cols.map(function(c){return '<td'+(c.num?' class="num"':'')+'>'+(c.render?c.render(r):esc(r[c.key]==null?'':r[c.key]))+'</td>';}).join('')+'</tr>';}).join(''):'<tr><td colspan="'+t.cols.length+'" style="text-align:center;color:var(--on-surface-variant);padding:26px">Nenhum resultado.</td></tr>';
    return '<table class="tbl"><thead><tr>'+th+'</tr></thead><tbody>'+tb+'</tbody></table>';
  }
  function updateCount(id){var el=document.getElementById('dtc-'+id);if(el)el.textContent=dtView(TABLES[id]).length+' de '+TABLES[id].rows.length+' linhas';}

  /* ==================================================================
     MODELO (dados) — com filtro por grupo
     ================================================================== */
  function rowM(rep,row){ return P.derive({impressions:rep.metric(row,'impressions'),clicks:rep.metric(row,'clicks'),cost:rep.metric(row,'cost'),conversions:rep.metric(row,'conversions')}); }
  function totalsFrom(rep){ return (rep&&rep.campaignTotal)?rowM(rep,rep.campaignTotal):null; }
  function aggTotals(list){var t={impressions:0,clicks:0,cost:0,conversions:0};list.forEach(function(g){t.impressions+=g.impressions;t.clicks+=g.clicks;t.cost+=g.cost;t.conversions+=g.conversions;});return P.derive(t);}
  function filterRep(rep,gf){ if(!rep||!gf) return rep; var di=rep.col('Grupo de anúncios'); if(di<0) return rep;
    var rows=rep.rows.filter(function(r){return gf.has(String(r[di]==null?'':r[di]).trim());}); return Object.assign({},rep,{rows:rows}); }

  function buildModel(reports,filters,withInsights){
    var gf=(filters&&filters.groups&&filters.groups.size)?filters.groups:null;
    var ads=filterRep(reports.ads,gf),kw=filterRep(reports.keywords,gf),st=filterRep(reports.searchterms,gf),
        age=filterRep(reports.age,gf),gen=filterRep(reports.gender,gf),inc=filterRep(reports.income,gf);
    var m={reports:reports,filteredByGroup:!!gf};
    m.period=(reports.campaign||reports.ads||reports.devices||{}).period||'';
    m.groups=ads?P.aggregateBy(ads,'Grupo de anúncios'):(reports.adgroup?P.aggregateBy(reports.adgroup,'Grupo de anúncios'):[]);
    m.groups.forEach(function(g){g.name=g.key;});
    m.totals=gf?aggTotals(m.groups):(totalsFrom(reports.campaign)||(ads?aggTotals(P.aggregateBy(ads,'Grupo de anúncios')):null)||{impressions:0,clicks:0,cost:0,conversions:0,ctr:0,cpc:0,cpa:0,convRate:0});
    m.campaigns=reports.campaign?reports.campaign.rows.map(function(r){var d=rowM(reports.campaign,r);d.name=reports.campaign.text(r,'Campanha');d.status=reports.campaign.text(r,'Status');d.statusReason=reports.campaign.text(r,'Motivos do status');d.budget=P.num(reports.campaign.text(r,'Orçamento'));return d;}):[];
    m.ads=ads?ads.rows.map(function(r){var d=rowM(ads,r);d.name=ads.text(r,'Título 1')||ads.text(r,'Tipo de anúncio');d.url=ads.text(r,'URL final');d.group=ads.text(r,'Grupo de anúncios');d.status=ads.text(r,'Status do anúncio')||ads.text(r,'Status');return d;}):[];
    m.keywords=kw?P.aggregateBy(kw,'Palavra-chave',{keep:['Grupo de anúncios']}):[];m.keywords.forEach(function(k){k.name=k.key.replace(/^"|"$/g,'');k.group=k.extra['Grupo de anúncios']||'';});
    m.terms=st?P.aggregateBy(st,'Termo de pesquisa',{keep:['Grupo de anúncios']}):[];m.terms.forEach(function(t){t.name=t.key;t.group=t.extra['Grupo de anúncios']||'';});
    m.locations=reports.locations?reports.locations.rows.map(function(r){var d=rowM(reports.locations,r);d.name=reports.locations.text(r,'Local');return d;}):[];
    m.devices=reports.devices?reports.devices.rows.map(function(r){var d=rowM(reports.devices,r);d.name=reports.devices.text(r,'Dispositivo');return d;}).filter(function(d){return d.name;}):[];
    m.age=age?P.aggregateBy(age,'Idade'):[];m.gender=gen?P.aggregateBy(gen,'Sexo'):[];m.income=inc?P.aggregateBy(inc,'Renda familiar'):[];
    m.schedule=reports.schedule?reports.schedule.rows.map(function(r){var d=rowM(reports.schedule,r);d.name=reports.schedule.text(r,'Data e hora');return d;}):[];
    if(withInsights)m.insights=generateInsights(m);
    return m;
  }

  /* ---------- Motor de insights (inalterado) ---------- */
  function generateInsights(m){
    var t=m.totals,pos=[],opp=[];var byCost=function(a,b){return b.cost-a.cost;},conv=function(x){return x.conversions>0;},noConv=function(x){return x.conversions===0&&x.cost>0;};
    var mobile=m.devices.filter(function(d){return /smart|celular|mobile/i.test(d.name);})[0];
    var desktop=m.devices.filter(function(d){return /comput|desktop/i.test(d.name);})[0];
    var gConv=m.groups.filter(conv).sort(function(a,b){return a.cpa-b.cpa;});
    var gWasteful=m.groups.filter(noConv).sort(byCost);var kwWaste=m.keywords.filter(noConv).sort(byCost);var termWaste=m.terms.filter(noConv).sort(byCost);
    var limited=m.campaigns.filter(function(c){return /limit/i.test(c.status||'')||/limit/i.test(c.statusReason||'');})[0];
    var ageUnknown=m.age.filter(function(a){return /desconhec/i.test(a.key);})[0];var totImpAge=m.age.reduce(function(s,a){return s+a.impressions;},0)||1;
    if(t.ctr>=0.03)pos.push({title:'CTR acima da média da Rede de Pesquisa',desc:'A campanha registrou CTR de '+pct(t.ctr)+' ('+int(t.clicks)+' cliques em '+int(t.impressions)+' impressões), acima da média típica de 3–5% para busca — sinal de anúncios e palavras-chave bem alinhados à intenção.'});
    if(gConv.length)pos.push({title:'Grupo mais eficiente: '+gConv[0].name,desc:'“'+gConv[0].name+'” entregou conversão com CPA de '+brl(gConv[0].cpa)+', o melhor da conta. Boa base para escalar investimento com previsibilidade.'});
    if(desktop&&desktop.conversions>0)pos.push({title:'Desktop converte com eficiência',desc:'Computadores geraram '+int(desktop.conversions)+' conversão(ões) com CPA de '+brl(desktop.cpa)+' e taxa de conversão de '+pct(desktop.convRate)+', bem acima do mobile — indica público mais qualificado nesse dispositivo.'});
    var bestGroupCtr=m.groups.slice().sort(function(a,b){return b.ctr-a.ctr;})[0];
    if(bestGroupCtr&&bestGroupCtr.impressions>30)pos.push({title:'Boa relevância em '+bestGroupCtr.name,desc:'O grupo “'+bestGroupCtr.name+'” alcançou CTR de '+pct(bestGroupCtr.ctr)+' com '+int(bestGroupCtr.impressions)+' impressões, mostrando forte aderência entre anúncio e busca.'});
    pos.push({title:'Custo por clique competitivo',desc:'O CPC médio de '+brl(t.cpc)+' está dentro do esperado para o nicho de engenharia industrial B2B, preservando o orçamento para tráfego qualificado.'});
    if(mobile&&mobile.conversions===0&&mobile.cost>0){var share=t.cost>0?mobile.cost/t.cost:0;opp.push({title:'Mobile concentra investimento sem converter',desc:'Smartphones representam '+pct(share,0)+' do investimento ('+brl(mobile.cost)+') e '+int(mobile.clicks)+' cliques, mas 0 conversão no período.',action:'Aplicar <b>ajuste de lance negativo por dispositivo</b> no mobile e revisar a experiência da landing page em celular (velocidade, formulário, clique-para-ligar).'});}
    if(kwWaste.length)opp.push({title:'Palavra-chave de maior custo sem retorno',desc:'“'+truncate(kwWaste[0].name,60)+'” consumiu '+brl(kwWaste[0].cost)+' em '+int(kwWaste[0].clicks)+' cliques sem gerar conversão — o maior desperdício entre as palavras-chave.',action:'Revisar <b>correspondência e página de destino</b> dessa palavra; se persistir, reduzir lance ou pausar e realocar verba para termos que convertem.'});
    if(termWaste.length){var brandish=termWaste.filter(function(x){return /nexia|superus|holding|s a|ltda/i.test(x.name);});var pick=brandish[0]||termWaste[0];opp.push({title:'Termos irrelevantes / de concorrentes gastando verba',desc:'Termos como “'+truncate(pick.name,42)+'” ('+brl(pick.cost)+', 0 conversão) atraem buscas de marca de terceiros e institucionais que não convertem.',action:'Adicionar <b>palavras-chave negativas</b> para concorrentes e nomes de empresas, refinando o tráfego para intenção comercial real.'});}
    if(limited)opp.push({title:'Campanha limitada por orçamento',desc:'A campanha “'+truncate(limited.name,42)+'” está com status “'+esc(limited.status)+'”'+(limited.budget?' (orçamento diário de '+brl(limited.budget)+')':'')+', ou seja, deixando de aparecer em parte dos leilões.',action:'Com CTR saudável, vale <b>aumentar o orçamento diário</b> de forma gradual para capturar mais volume qualificado sem perder eficiência.'});
    if(t.conversions<=3)opp.push({title:'Volume de conversões baixo para otimização',desc:'Foram '+int(t.conversions)+' conversão(ões) em '+int(t.clicks)+' cliques ('+pct(t.convRate)+'). Volume baixo dificulta lances automáticos e leitura estatística.',action:'Auditar o <b>rastreamento de conversões</b> (tags/eventos) e reforçar CRO da página — CTAs, prova social e formulário — para transformar cliques em contatos.'});
    if(ageUnknown&&(ageUnknown.impressions/totImpAge)>0.15)opp.push({title:'Alta parcela de público “Desconhecido”',desc:'“Desconhecida” responde por '+pct(ageUnknown.impressions/totImpAge,0)+' das impressões por idade — dado demográfico incompleto por limitações de sinal/consentimento.',action:'Não excluir esse público automaticamente; <b>monitorar tendência</b> e reforçar sinais de conversão para melhorar a modelagem do Google ao longo do tempo.'});
    var priority;
    if(mobile&&mobile.conversions===0&&desktop&&desktop.conversions>0)priority={title:'Realocar verba do mobile para desktop e destravar o orçamento',desc:'Hoje o mobile consome '+pct(t.cost>0?mobile.cost/t.cost:0,0)+' do investimento sem converter, enquanto o desktop entrega as conversões a um CPA de '+brl(desktop.cpa)+'. No próximo mês, priorize: (1) ajuste de lance negativo no mobile e correção da landing em celular; (2) aumento gradual do orçamento diário, já que a campanha está limitada; e (3) revisão do rastreamento de conversões — 1 conversão em '+int(t.clicks)+' cliques indica gargalo entre o clique e o lead. Essas três ações atacam a maior alavanca de eficiência da conta.'};
    else if(gWasteful.length)priority={title:'Cortar desperdício e reforçar o que converte',desc:'O grupo “'+gWasteful[0].name+'” concentra '+brl(gWasteful[0].cost)+' sem conversão. Realoque essa verba para “'+(gConv[0]?gConv[0].name:'os grupos que convertem')+'”, adicione negativas para termos irrelevantes e valide o rastreamento de conversões antes de escalar.'};
    else priority={title:'Escalar com foco em conversão',desc:'Com CTR saudável e CPC controlado, o próximo passo é aumentar volume qualificado: elevar orçamento gradualmente, reforçar CRO da página e monitorar o CPA por grupo e dispositivo.'};
    return {positives:pos.slice(0,3),opportunities:opp.slice(0,3),priority:priority};
  }

  }

  function pgInsights(){
    var ins=STATE.fullModel.insights,h=head('10','Insights e Recomendações','Leitura estratégica do período: o que funcionou, onde melhorar e a prioridade para o próximo mês.');
    if(STATE.model.filteredByGroup)h+='<div class="callout info sample-banner">'+msym('info')+'<div>As recomendações abaixo consideram a conta <b>inteira</b> (não são afetadas pelo filtro de grupo ativo).</div></div>';
    h+='<div class="grid g-2">';
    h+='<div><div class="section-title">'+msym('thumb_up','s20')+'Pontos positivos</div><div class="ins-col">'+ins.positives.map(function(p){return '<div class="ins pos"><div class="ic">'+msym('check','fill')+'</div><div><div class="it">'+esc(p.title)+'</div><div class="id">'+esc(p.desc)+'</div></div></div>';}).join('')+'</div></div>';
    h+='<div><div class="section-title">'+msym('trending_up','s20')+'Oportunidades de melhoria</div><div class="ins-col">'+ins.opportunities.map(function(o){return '<div class="ins opp"><div class="ic">'+msym('tips_and_updates','fill')+'</div><div><div class="it">'+esc(o.title)+'</div><div class="id">'+esc(o.desc)+'</div><div class="act">'+msym('arrow_forward','s18')+'<span><b>Ação:</b> '+o.action+'</span></div></div></div>';}).join('')+'</div></div>';
    h+='</div>';
    h+='<div class="priority mt24"><div class="p-cap">'+msym('flag','fill')+'Recomendação prioritária para o próximo mês</div><h3>'+esc(ins.priority.title)+'</h3><p>'+esc(ins.priority.desc)+'</p></div>';
    return h;
  }

  var R={resumo:pgResumo,campanhas:pgCampanhas,anuncios:pgAnuncios,palavras:pgPalavras,termos:pgTermos,locais:pgLocais,dispositivos:pgDispositivos,programacao:pgProgramacao,publico:pgPublico,insights:pgInsights};

  /* ==================================================================
     SHELL, TOOLTIP, NAV, FILTROS, TEMA, APRESENTAÇÃO, UPLOAD
     ================================================================== */
  var tipEl;
  function initContentHandlers(container){
    tipEl=document.createElement('div');tipEl.className='tooltip';document.body.appendChild(tipEl);
    container.addEventListener('mouseover',function(e){var el=e.target.closest('[data-tip]');if(!el)return;try{var d=JSON.parse(el.dataset.tip);tipEl.innerHTML='<div class="tt-t">'+esc(d.t)+'</div>'+d.r.map(function(r){return '<div class="tt-r"><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>';}).join('');tipEl.classList.add('show');}catch(err){}});
    container.addEventListener('mousemove',function(e){if(!tipEl.classList.contains('show'))return;var x=e.clientX+14,y=e.clientY+14,w=tipEl.offsetWidth,hh=tipEl.offsetHeight;if(x+w>window.innerWidth-8)x=e.clientX-w-14;if(y+hh>window.innerHeight-8)y=e.clientY-hh-14;tipEl.style.left=x+'px';tipEl.style.top=y+'px';});
    container.addEventListener('mouseout',function(e){if(e.target.closest('[data-tip]'))tipEl.classList.remove('show');});
    container.addEventListener('click',function(e){
      var th=e.target.closest('[data-sortkey]');
      if(th){var wrap=th.closest('[data-dt]'),id=wrap.getAttribute('data-dt'),t=TABLES[id],key=th.getAttribute('data-sortkey');
        if(t.sort&&t.sort.key===key)t.sort.dir=t.sort.dir==='asc'?'desc':'asc';else t.sort={key:key,dir:isNumCol(t,key)?'desc':'asc'};
        wrap.querySelector('[data-dtbody]').innerHTML=dtInner(id);updateCount(id);return;}
      var slice=e.target.closest('[data-slice]');
      if(slice){setGroupFilter(slice.getAttribute('data-slice'));return;}
    });
    container.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var th=e.target.closest('[data-sortkey]');var sl=e.target.closest('[data-slice]');if(th){e.preventDefault();th.click();}else if(sl){e.preventDefault();setGroupFilter(sl.getAttribute('data-slice'));}});
    container.addEventListener('input',function(e){var inp=e.target.closest('.dt-search input');if(!inp)return;var wrap=inp.closest('[data-dt]'),id=wrap.getAttribute('data-dt');TABLES[id].q=inp.value;wrap.querySelector('[data-dtbody]').innerHTML=dtInner(id);updateCount(id);});
  }

  function renderShell(){
    var nav=PAGES.map(function(p){return '<button class="nav-item" data-page="'+p.id+'" aria-label="'+esc(p.label)+'">'+msym(p.icon)+'<span>'+esc(p.label)+'</span><span class="idx">'+p.idx+'</span></button>';}).join('');
    document.getElementById('app').innerHTML=
      '<aside class="rail" id="rail"><div class="brand"><div class="mark">SL</div><div><div class="name">SL Process</div><div class="sub">Dashboard Google Ads</div></div></div><nav class="nav" id="nav">'+nav+'</nav><div class="rail-foot">Engenharia Industrial · Brasil<br>Campanha de Rede de Pesquisa</div></aside>'+
      '<div class="rail-scrim hidden" id="railScrim"></div>'+
      '<div class="main">'+
        '<div class="appbar"><div class="lead"><button class="menu-btn" id="menuBtn" aria-label="Menu">'+msym('menu')+'</button><div><div class="crumb">SL Process · Campanha de Rede de Pesquisa</div><h1 id="pageTitle">Resumo Executivo</h1></div></div>'+
          '<div class="actions"><span class="chip" id="periodChip">'+msym('calendar_month','s18')+'<span id="periodTxt">—</span></span>'+
          '<button class="icon-btn" id="themeBtn" aria-label="Alternar tema">'+msym('dark_mode')+'</button>'+
          '<button class="icon-btn" id="presentBtn" aria-label="Modo apresentação">'+msym('slideshow')+'</button>'+
          '<button class="btn btn-filled" id="uploadBtn">'+msym('cloud_upload','s20')+'<span class="btn-txt">Atualizar planilhas</span></button></div></div>'+
        '<div class="slicer" id="slicer"></div>'+
        '<div class="content" id="content"></div></div>'+
      '<div class="present-bar" id="presentBar"><button id="pPrev" aria-label="Página anterior">'+msym('chevron_left')+'</button><span class="pb-pos" id="pPos">1 / 10</span><button id="pNext" aria-label="Próxima página">'+msym('chevron_right')+'</button><button class="pb-exit" id="pExit" aria-label="Sair da apresentação">'+msym('close')+'</button></div>';
    document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('.nav-item');if(!b)return;navigate(b.getAttribute('data-page'));closeRail();});
    document.getElementById('uploadBtn').addEventListener('click',openUpload);
    document.getElementById('menuBtn').addEventListener('click',function(){document.getElementById('rail').classList.toggle('open');document.getElementById('railScrim').classList.toggle('hidden');});
    document.getElementById('railScrim').addEventListener('click',closeRail);
    document.getElementById('themeBtn').addEventListener('click',toggleTheme);
    document.getElementById('presentBtn').addEventListener('click',togglePresent);
    document.getElementById('pPrev').addEventListener('click',function(){stepPage(-1);});
    document.getElementById('pNext').addEventListener('click',function(){stepPage(1);});
    document.getElementById('pExit').addEventListener('click',togglePresent);
    document.getElementById('slicer').addEventListener('click',onSlicerClick);
    document.getElementById('slicer').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){var c=e.target.closest('[data-group],[data-all],[data-clear]');if(c){e.preventDefault();c.click();}}});
    initContentHandlers(document.getElementById('content'));
  }
  function closeRail(){document.getElementById('rail').classList.remove('open');document.getElementById('railScrim').classList.add('hidden');}

  /* ---- Slicer ---- */
  function renderSlicer(){
    var f=STATE.filters.groups,all=STATE.allGroups;
    var chips='<span class="s-lab">'+msym('filter_alt','s18')+'Grupo de anúncios</span>';
    chips+='<button class="slice-chip all'+(!f?' active':'')+'" data-all role="button">Todos</button>';
    chips+=all.map(function(g){var active=f&&f.has(g);return '<button class="slice-chip'+(active?' active':'')+'" data-group="'+esc(g)+'"><span class="dot" style="background:'+gcol(g)+'"></span>'+esc(truncate(g,26))+'</button>';}).join('');
    var right='';
    if(f)right='<div class="s-right"><span class="s-note">'+f.size+' de '+all.length+' grupos</span><button class="s-clear" data-clear>'+msym('close','s18')+'Limpar filtro</button></div>';
    document.getElementById('slicer').innerHTML=chips+right;
  }
  function onSlicerClick(e){
    var all=e.target.closest('[data-all]');if(all){STATE.filters.groups=null;return applyFilter();}
    var clr=e.target.closest('[data-clear]');if(clr){STATE.filters.groups=null;return applyFilter();}
    var g=e.target.closest('[data-group]');if(g){toggleGroup(g.getAttribute('data-group'));}
  }
  function toggleGroup(name){
    var f=STATE.filters.groups?new Set(STATE.filters.groups):new Set();
    if(f.has(name))f.delete(name);else f.add(name);
    STATE.filters.groups=(f.size===0||f.size===STATE.allGroups.length)?null:f;
    applyFilter();
  }
  function setGroupFilter(name){
    var f=STATE.filters.groups;
    if(f&&f.size===1&&f.has(name))STATE.filters.groups=null;else STATE.filters.groups=new Set([name]);
    applyFilter();
  }
  function applyFilter(){STATE.model=buildModel(STATE.reports,STATE.filters,false);renderSlicer();navigate(STATE.page);}

  /* ---- Navegação ---- */
  function navigate(pageId){
    STATE.page=pageId;
    var p=PAGES.filter(function(x){return x.id===pageId;})[0]||PAGES[0];
    document.getElementById('pageTitle').textContent=p.title;
    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'),function(el){el.classList.toggle('active',el.getAttribute('data-page')===pageId);});
    var banner=STATE.usingSample?'<div class="callout info sample-banner">'+msym('science')+'<div>Exibindo <b>dados de exemplo</b>. Clique em <b>“Atualizar planilhas”</b> para subir os CSVs do mês e gerar o relatório.</div></div>':'';
    var flag='';
    if(STATE.filters.groups){var names=Array.from(STATE.filters.groups);flag='<div class="filter-flag">'+msym('filter_alt','s18')+'Filtrado por grupo: '+esc(names.map(function(n){return truncate(n,22);}).join(', '))+'</div>';}
    document.getElementById('content').innerHTML=banner+flag+(R[pageId]||pgResumo)(STATE.model);
    requestAnimationFrame(function(){Array.prototype.forEach.call(document.querySelectorAll('.kpi .meter i'),function(el){var w=el.style.width;el.style.width='0';requestAnimationFrame(function(){el.style.width=w;});});});
    updatePresentBar();window.scrollTo(0,0);
  }
  function refresh(){
    computeGroupColors();
    STATE.fullModel=buildModel(STATE.reports,{groups:null},true);
    STATE.model=buildModel(STATE.reports,STATE.filters,false);
    document.getElementById('periodTxt').textContent=STATE.model.period||'—';
    renderSlicer();navigate(STATE.page);
  }
  function computeGroupColors(){
    STATE.allGroups=[];STATE.groupColorMap={};
    var full=STATE.reports.ads?P.aggregateBy(STATE.reports.ads,'Grupo de anúncios'):(STATE.reports.keywords?P.aggregateBy(STATE.reports.keywords,'Grupo de anúncios'):[]);
    full.sort(function(a,b){return b.cost-a.cost;}).forEach(function(g,i){if(g.key&&STATE.allGroups.indexOf(g.key)<0){STATE.allGroups.push(g.key);STATE.groupColorMap[g.key]=series()[i%series().length];}});
  }

  /* ---- Tema ---- */
  function applyTheme(t){STATE.theme=t;document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('sl_theme',t);}catch(e){}
    Object.assign(C,t==='dark'?DARK:LIGHT);computeGroupColors();
    var b=document.getElementById('themeBtn');if(b)b.innerHTML=msym(t==='dark'?'light_mode':'dark_mode');
    navigate(STATE.page);}
  function toggleTheme(){applyTheme(STATE.theme==='dark'?'light':'dark');}

  /* ---- Apresentação ---- */
  function togglePresent(){
    STATE.present=!STATE.present;document.body.classList.toggle('present',STATE.present);
    var b=document.getElementById('presentBtn');
    if(STATE.present){try{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}catch(e){}if(b)b.innerHTML=msym('close_fullscreen');}
    else{try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();}catch(e){}if(b)b.innerHTML=msym('slideshow');}
    updatePresentBar();
  }
  function stepPage(dir){var i=PAGES.map(function(p){return p.id;}).indexOf(STATE.page);i=(i+dir+PAGES.length)%PAGES.length;navigate(PAGES[i].id);}
  function updatePresentBar(){var i=PAGES.map(function(p){return p.id;}).indexOf(STATE.page);var el=document.getElementById('pPos');if(el)el.textContent=(i+1)+' / '+PAGES.length;}
  document.addEventListener('keydown',function(e){if(!STATE.present)return;if(e.key==='ArrowRight')stepPage(1);else if(e.key==='ArrowLeft')stepPage(-1);else if(e.key==='Escape'){if(!document.fullscreenElement)togglePresent();}});
  document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&STATE.present){STATE.present=false;document.body.classList.remove('present');var b=document.getElementById('presentBtn');if(b)b.innerHTML=msym('slideshow');}});

  /* ---- Upload ---- */
  function typeLabel(t){return ({campaign:'Campanha',adgroup:'Grupos de anúncios',ads:'Anúncios',keywords:'Palavras-chave',searchterms:'Termos de pesquisa',locations:'Locais',devices:'Dispositivos',schedule:'Programação',age:'Idade',gender:'Gênero',income:'Renda familiar'})[t]||t;}
  function openUpload(){
    var ov=document.createElement('div');ov.className='scrim';ov.id='scrim';
    ov.innerHTML='<div class="dialog"><div class="d-head"><div class="d-ic">'+msym('cloud_upload')+'</div><div><h3>Atualizar planilhas do mês</h3><p>Arraste ou selecione os CSVs exportados do Google Ads. O dashboard identifica cada relatório pelo título e recalcula tudo.</p></div></div><div class="d-body"><label class="dropzone" id="dropzone"><input type="file" id="fileInput" accept=".csv,text/csv" multiple hidden>'+msym('upload_file')+'<div class="dz-t">Solte os CSVs aqui ou clique para selecionar</div><div class="dz-s">Até 11 relatórios · formato .csv do Google Ads</div></label><div class="file-list" id="fileList"></div><div class="d-foot"><span class="note" id="uNote">Nenhum arquivo novo selecionado.</span><div class="acts"><button class="btn btn-text" id="cancelUp">Fechar</button><button class="btn btn-filled" id="applyUp">Gerar relatório</button></div></div></div></div>';
    document.body.appendChild(ov);
    var staged={},dz=document.getElementById('dropzone'),fi=document.getElementById('fileInput');
    function renderList(){var keys=Object.keys(staged);document.getElementById('fileList').innerHTML=keys.map(function(k){var s=staged[k];return '<div class="file-row '+(s.ok?'ok':'err')+'">'+msym(s.ok?'check_circle':'error')+'<span class="fn">'+esc(s.fileName)+'</span><span class="ft">'+esc(s.ok?typeLabel(k):'não reconhecido')+'</span></div>';}).join('');var okc=keys.filter(function(k){return staged[k].ok;}).length;document.getElementById('uNote').textContent=okc?okc+' relatório(s) reconhecido(s).':'Nenhum arquivo novo selecionado.';}
    function handle(list){var arr=Array.prototype.slice.call(list),pending=arr.length;if(!pending)return;arr.forEach(function(file){var rd=new FileReader();rd.onload=function(){try{var rep=P.parseReport(String(rd.result),file.name);if(rep&&rep.type!=='unknown')staged[rep.type]={report:rep,fileName:file.name,ok:true};else staged['?'+file.name]={fileName:file.name,ok:false};}catch(e){staged['?'+file.name]={fileName:file.name,ok:false};}if(--pending===0)renderList();};rd.onerror=function(){staged['?'+file.name]={fileName:file.name,ok:false};if(--pending===0)renderList();};rd.readAsText(file,'utf-8');});}
    fi.addEventListener('change',function(){handle(fi.files);});
    ['dragenter','dragover'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.add('drag');});});
    ['dragleave','drop'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.remove('drag');});});
    dz.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files)handle(e.dataTransfer.files);});
    document.getElementById('cancelUp').addEventListener('click',function(){document.body.removeChild(ov);});
    ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
    document.getElementById('applyUp').addEventListener('click',function(){var okKeys=Object.keys(staged).filter(function(k){return staged[k].ok;});if(!okKeys.length){document.getElementById('uNote').textContent='Selecione ao menos um CSV válido do Google Ads.';return;}okKeys.forEach(function(k){STATE.reports[k]=staged[k].report;STATE.files.push(staged[k].fileName);});STATE.usingSample=false;STATE.filters.groups=null;document.body.removeChild(ov);refresh();});
  }

  /* ---- Init ---- */
  function b64ToText(b64){var bin=atob(b64),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes);}
  function loadSample(){var S=window.SL_SAMPLE||{};Object.keys(S).forEach(function(fn){try{var rep=P.parseReport(b64ToText(S[fn]),fn);if(rep&&rep.type!=='unknown')STATE.reports[rep.type]=rep;}catch(e){}});STATE.usingSample=true;}
  function init(){
    var saved='light';try{saved=localStorage.getItem('sl_theme')||'light';}catch(e){}
    STATE.theme=saved;document.documentElement.setAttribute('data-theme',saved);Object.assign(C,saved==='dark'?DARK:LIGHT);
    renderShell();
    var tb=document.getElementById('themeBtn');if(tb)tb.innerHTML=msym(saved==='dark'?'light_mode':'dark_mode');
    loadSample();refresh();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();

</script>
</body>
